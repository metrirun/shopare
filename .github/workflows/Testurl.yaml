name: "Check URL Accessibility"

on: [push]

jobs:
  check-url:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          # اگر فایل requirements.txt دارید:
          # pip install -r requirements.txt
      
      - name: Check URL accessibility
        run: python check_url.py
      
      - name: Show result
        if: always()  # این مرحله همیشه اجرا می‌شود
        run: echo "بررسی دسترسی به لینک انجام شد"
