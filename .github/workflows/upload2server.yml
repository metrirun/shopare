name: "Upload JSON to Server (Python)"

on:
  push:
    branches:
      - branch_part_26
  workflow_dispatch:

jobs:
  upload-json:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: branch_part_26
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Check file exists
        id: check_file
        run: |
          if [ -f "split_info_4.json" ]; then
            echo "✅ فایل split_info_4.json وجود دارد"
            echo "file_exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ فایل split_info_4.json وجود ندارد"
            echo "file_exists=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: Upload to server
        if: steps.check_file.outputs.file_exists == 'true'
        run: python upload_to_server.py
