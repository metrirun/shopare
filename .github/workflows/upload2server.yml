name: "Upload JSON to Server (Curl)"

on:
  push:
    branches:
      - branch_part_26
  workflow_dispatch:

jobs:
  upload-json:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: branch_part_26
      
      - name: Check file exists
        id: check_file
        run: |
          if [ -f "split_info_4.json" ]; then
            echo "✅ فایل split_info_4.json وجود دارد"
            echo "file_exists=true" >> $GITHUB_OUTPUT
          else
            echo "❌ فایل split_info_4.json وجود ندارد"
            echo "file_exists=false" >> $GITHUB_OUTPUT
            exit 1
          fi
      
      - name: Upload JSON to server using curl
        if: steps.check_file.outputs.file_exists == 'true'
        run: |
          echo "📤 ارسال فایل به سرور..."
          
          # روش 1: ارسال محتوای JSON
          curl -X POST "http://45.147.76.237:8005/upload-json" \
            -H "Content-Type: application/json" \
            -d @split_info_4.json \
            -w "\n\n✅ کد وضعیت: %{http_code}\n" \
            --max-time 30 \
            --verbose
          
          echo ""
          echo "📤 روش 2: ارسال به عنوان فایل..."
          
          # روش 2: ارسال به عنوان فایل
          curl -X POST "http://45.147.76.237:8005/upload-files" \
            -F "files=@split_info_4.json" \
            -w "\n\n✅ کد وضعیت: %{http_code}\n" \
            --max-time 30 \
            --verbose
      
      - name: Verify upload
        if: always()
        run: |
          echo "✅ عملیات آپلود به پایان رسید"
          echo "🌐 سرور: http://45.147.76.237:8005"
