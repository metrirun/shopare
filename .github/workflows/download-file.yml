name: "Download and Commit File"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # امکان اجرای دستی

jobs:
  download-file:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # اجازه نوشتن در ریپو
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # برای دسترسی به تاریخچه کامل
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download and commit file
        run: python download_and_commit.py
      
      - name: Check file existence
        if: always()
        run: |
          if [ -f "Metrica_Tracking.zip" ]; then
            echo "✅ فایل وجود دارد"
            ls -lh Metrica_Tracking.zip
          else
            echo "❌ فایل وجود ندارد"
          fi
