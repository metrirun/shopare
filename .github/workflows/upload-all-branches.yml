name: "Upload All Branches Files to Server"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 1 *'

jobs:
  upload-all-branches:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Upload all files
        run: python upload_all_branches.py
      
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: upload-report
          path: upload_report.txt
